[project]
name = "postgres search"
version = "0.1.0"
description = "Postgres search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=3.0.0",
    "psycopg2-binary>=2.9.0",
    "tqdm>=4.66.0",
    "psycopg2-binary",
    "sentence-transformers>=2.2.2",
    "numpy>=1.24.3",
    "torch>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true